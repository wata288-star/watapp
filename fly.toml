# Fly.io デプロイ設定（永続ボリュームに SQLite を保存）
# 初回: fly launch --copy-config --no-deploy  →  fly volumes create flyheit_data --size 1
#       fly secrets set FLYHEIT_PASSCODE=好きなパスコード  →  fly deploy
# app 名は fly launch 時に自分のものに書き換わります。

app = "flyheit"
primary_region = "nrt" # 東京

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# DB(SQLite)を保存する永続ボリューム。/app/data にマウント。
[mounts]
  source = "flyheit_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
