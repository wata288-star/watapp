<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOMARUN ― 動くUIデモ</title>
<style>
/* ==========================================================================
   TOMARUN / design tokens
   現場（手袋・騒音・暗所）で使う前提。タップ最小56px、本文15px以上。
   機械が出す値（エラーコード・時刻・アワーメーター・記録番号）は等幅で組む。
   ========================================================================== */
:root{
  color-scheme: light dark;

  --paper:#f2f5f8;        /* 機械の塗装に寄せた青みグレー */
  --card:#ffffff;
  --sunk:#e9eef4;
  --line:#e982ef00;
  --line:#e1e7ef;
  --ink:#0f141c;          /* 青みを含む黒。純黒は使わない */
  --ink-2:#48566b;
  --ink-3:#7a8798;
  --signal:#1f5fe0;       /* 操作はこの一色だけ */
  --signal-soft:#e8effc;
  --signal-line:#c6d8f8;
  --halt:#e0393e;         /* 停止・危険 */
  --halt-soft:#fdeaea;
  --clear:#0e9c6b;        /* 解決・完了 */
  --clear-soft:#e6f6ef;
  --caution:#b7770b;      /* 注意 */
  --caution-soft:#fbf1de;
  --panel:#0f141c;        /* 暗いパネル面（プレイヤー・プロフィール） */
  --panel-ink:#c6d2e4;

  --f:1;                                  /* 文字サイズ設定の倍率 */
  --t-micro:calc(11.5px * var(--f));
  --t-sm:calc(13px * var(--f));
  --t-body:calc(15px * var(--f));
  --t-lg:calc(17px * var(--f));
  --t-h2:calc(20px * var(--f));
  --t-h1:calc(24px * var(--f));

  --r-card:20px;
  --r-ctl:14px;
  --tap:56px;

  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",Meiryo,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono","Noto Sans Mono",monospace;
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#0b0f16; --card:#141a24; --sunk:#1b2330; --line:#26303f;
    --ink:#e9eef6; --ink-2:#a7b4c6; --ink-3:#78859a;
    --signal:#6e9cff; --signal-soft:#182740; --signal-line:#2c4370;
    --halt:#ff6b6f; --halt-soft:#33191b; --clear:#3ecf9a; --clear-soft:#12271f;
    --caution:#e0a44a; --caution-soft:#2b2114;
    --panel:#05080d; --panel-ink:#9fb0c8;
  }
}
:root[data-theme="dark"]{
  --paper:#0b0f16; --card:#141a24; --sunk:#1b2330; --line:#26303f;
  --ink:#e9eef6; --ink-2:#a7b4c6; --ink-3:#78859a;
  --signal:#6e9cff; --signal-soft:#182740; --signal-line:#2c4370;
  --halt:#ff6b6f; --halt-soft:#33191b; --clear:#3ecf9a; --clear-soft:#12271f;
  --caution:#e0a44a; --caution-soft:#2b2114;
  --panel:#05080d; --panel-ink:#9fb0c8;
}
:root[data-theme="light"]{
  --paper:#f2f5f8; --card:#ffffff; --sunk:#e9eef4; --line:#e1e7ef;
  --ink:#0f141c; --ink-2:#48566b; --ink-3:#7a8798;
  --signal:#1f5fe0; --signal-soft:#e8effc; --signal-line:#c6d8f8;
  --halt:#e0393e; --halt-soft:#fdeaea; --clear:#0e9c6b; --clear-soft:#e6f6ef;
  --caution:#b7770b; --caution-soft:#fbf1de;
  --panel:#0f141c; --panel-ink:#c6d2e4;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100dvh;
  background:
    radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--signal) 7%, transparent), transparent 60%),
    var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
a{color:inherit;text-decoration:none;}
input,textarea,select{font:inherit;color:inherit;}
:focus-visible{outline:2.5px solid var(--signal);outline-offset:2px;border-radius:6px;}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.01em;}

/* --------------------------------------------------------------- ステージ */
.stage{
  min-height:100dvh;
  display:grid;
  grid-template-columns:220px auto;
  gap:56px;
  padding:28px;
  align-items:center;
  justify-content:center;
}
.rail{
  align-self:center;
  justify-self:end;
  width:100%;
  max-width:220px;
}
.rail__brand{
  display:flex;align-items:baseline;gap:8px;margin-bottom:4px;
  font-size:15px;font-weight:900;letter-spacing:.06em;
}
.rail__brand i{font-style:normal;color:var(--signal);}
.rail__tag{
  font-size:11.5px;font-weight:700;color:var(--ink-3);
  margin-bottom:18px;letter-spacing:.02em;
}
.rail__group{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin:16px 0 6px;
}
.rail__item{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:7px 10px;border-radius:9px;text-align:left;
  font-size:12.5px;font-weight:700;color:var(--ink-2);
}
.rail__item:hover{background:var(--sunk);}
.rail__item[data-on="true"]{background:var(--signal-soft);color:var(--signal);}
.rail__item::before{
  content:"";width:5px;height:5px;border-radius:50%;
  background:currentColor;opacity:.35;flex:none;
}
.rail__item[data-on="true"]::before{opacity:1;}
.rail__note{
  margin-top:22px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11px;line-height:1.75;color:var(--ink-3);font-weight:600;
}

/* --------------------------------------------------------------- 実機枠 */
.device{
  width:min(100%,394px);
  height:min(852px, calc(100dvh - 56px));
  background:var(--card);
  border:11px solid #0b0f16;
  border-radius:52px;
  box-shadow:0 40px 80px -30px rgba(9,16,30,.5), 0 0 0 1px rgba(9,16,30,.18);
  overflow:hidden;
  position:relative;
  display:flex;flex-direction:column;
}
:root[data-theme="dark"] .device{border-color:#000;}
.app{
  flex:1;min-height:0;display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink);
  font-size:var(--t-body);line-height:1.7;
  position:relative;overflow:hidden;
}

/* ステータスバー */
.statusbar{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:12px 26px 4px;background:var(--card);
  font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.02em;
}
.statusbar__right{display:flex;align-items:center;gap:5px;opacity:.9;}
.statusbar--onpanel{background:transparent;color:#fff;position:absolute;top:0;left:0;right:0;z-index:3;}

@media (max-width:900px){
  .stage{grid-template-columns:minmax(0,1fr);gap:0;padding:0;}
  .rail{display:none;}
  .device{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none;}
}

/* --------------------------------------------------------------- ヘッダー */
.bar{
  flex:none;display:flex;align-items:center;gap:12px;
  padding:6px 16px 14px;background:var(--card);
  border-bottom:1px solid var(--line);
}
.bar__back{
  flex:none;width:40px;height:40px;border-radius:12px;background:var(--sunk);
  display:grid;place-items:center;color:var(--ink-2);
}
.bar__back:active{background:var(--signal-soft);color:var(--signal);}
.bar__t{flex:1;min-width:0;}
.bar__t b{display:block;font-size:var(--t-lg);font-weight:900;line-height:1.4;letter-spacing:.01em;}
.bar__t span{display:block;font-size:var(--t-micro);font-weight:700;color:var(--ink-3);}
.bar__act{
  flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 13px;
  border-radius:12px;background:var(--signal-soft);color:var(--signal);
  font-size:var(--t-sm);font-weight:800;
}

/* --------------------------------------------------------------- 本文 */
.view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;}
/* ホームだけは2カードで残りの高さを埋める */
.view[data-screen="home"]{display:flex;flex-direction:column;}
.pad{padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px;}
.lead{margin:0;font-size:var(--t-sm);font-weight:600;color:var(--ink-3);line-height:1.75;}

.label{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:6px 2px -4px;
  font-family:var(--mono);font-size:10.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}
.label em{font-style:normal;font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:var(--t-micro);}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
}
.card--pad{padding:16px 18px;}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;}

/* 行 */
.row{
  display:flex;align-items:center;gap:13px;width:100%;
  min-height:var(--tap);padding:14px 16px;text-align:left;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none;}
.row:active{background:var(--sunk);}
.row__ico{
  flex:none;width:38px;height:38px;border-radius:11px;
  background:var(--signal-soft);color:var(--signal);display:grid;place-items:center;
}
.row__b{flex:1;min-width:0;}
.row__b b{display:block;font-size:var(--t-body);font-weight:800;line-height:1.5;}
.row__b p{margin:1px 0 0;font-size:var(--t-micro);font-weight:600;color:var(--ink-3);line-height:1.6;}
.row__chev{flex:none;color:var(--ink-3);opacity:.6;}

/* ボタン */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:var(--tap);padding:8px 18px;border-radius:var(--r-ctl);
  font-size:var(--t-lg);font-weight:800;letter-spacing:.02em;line-height:1.35;
  transition:transform .07s ease, background .15s ease;
}
.btn:active{transform:scale(.985);}
.btn--primary{background:var(--signal);color:#fff;}
:root[data-theme="dark"] .btn--primary{color:#0b0f16;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn--primary{color:#0b0f16;}}
.btn--ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);}
.btn--soft{background:var(--signal-soft);color:var(--signal);}
.btn--sm{min-height:46px;font-size:var(--t-sm);border-radius:12px;}
.btn[disabled]{opacity:.4;pointer-events:none;}

.dock{
  flex:none;display:flex;gap:10px;padding:12px 16px;
  background:color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
}
.dock .btn{flex:1;min-width:0;font-size:var(--t-body);}

/* チップ */
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 16px;margin:0 -16px;scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 15px;
  border-radius:999px;border:1.5px solid var(--line);background:var(--card);
  font-size:var(--t-sm);font-weight:700;color:var(--ink-2);white-space:nowrap;
}
.chip[data-on="true"]{border-color:var(--signal);background:var(--signal-soft);color:var(--signal);}
.chip--sm{min-height:38px;padding:0 13px;font-size:var(--t-micro);}
.chip i{
  font-style:normal;display:inline-grid;place-items:center;min-width:18px;height:18px;
  padding:0 5px;border-radius:999px;background:var(--caution);color:#fff;
  font-family:var(--mono);font-size:10px;font-weight:700;
}

/* タグ */
.tag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:7px;
  font-size:var(--t-micro);font-weight:800;line-height:1.6;white-space:nowrap;
}
.tag--code{font-family:var(--mono);font-size:11px;letter-spacing:.02em;background:var(--halt-soft);color:var(--halt);}
.tag--signal{background:var(--signal-soft);color:var(--signal);}
.tag--clear{background:var(--clear-soft);color:var(--clear);}
.tag--caution{background:var(--caution-soft);color:var(--caution);}
.tag--mute{background:var(--sunk);color:var(--ink-3);}

/* 入力 */
.input,.textarea,.select{
  width:100%;min-height:var(--tap);padding:14px 15px;border-radius:var(--r-ctl);
  border:1.5px solid var(--line);background:var(--card);
  font-size:16px;font-weight:600;
}
.textarea{min-height:132px;line-height:1.85;resize:vertical;font-size:var(--t-body);}
.search{
  display:flex;align-items:center;gap:11px;height:var(--tap);padding:0 16px;
  border-radius:var(--r-ctl);background:var(--card);border:1.5px solid var(--line);color:var(--ink-3);
}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;font-weight:600;color:var(--ink);}

/* 注意ブロック（原文のまま・省略しない） */
.notice{
  display:flex;gap:11px;padding:14px 16px;border-radius:var(--r-ctl);
  font-size:var(--t-sm);font-weight:600;line-height:1.85;border:1px solid;
}
.notice b{
  display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;margin-bottom:3px;
}
.notice svg{flex:none;margin-top:3px;}
.notice--halt{background:var(--halt-soft);border-color:color-mix(in srgb,var(--halt) 30%,transparent);color:var(--halt);}
.notice--caution{background:var(--caution-soft);border-color:color-mix(in srgb,var(--caution) 30%,transparent);color:var(--caution);}
.notice--signal{background:var(--signal-soft);border-color:var(--signal-line);color:var(--signal);}
.notice--halt span,.notice--caution span,.notice--signal span{color:var(--ink);display:block;}

/* --------------------------------------------------------------- タブバー */
.tabs{
  flex:none;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:max(6px, env(safe-area-inset-bottom));
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:58px;color:var(--ink-3);font-size:10.5px;font-weight:800;letter-spacing:.02em;
}
.tab[data-on="true"]{color:var(--signal);}

/* --------------------------------------------------------------- ホーム */
.hero{position:relative;flex:none;background:var(--panel);overflow:hidden;}
.btn--stack{flex-direction:column;gap:1px;line-height:1.3;}
.btn--stack small{font-size:calc(11px * var(--f));font-weight:700;color:var(--ink-3);}
.hero canvas{display:block;width:100%;height:100%;position:absolute;inset:0;}
.hero__in{position:relative;padding:56px 20px 26px;}
.hero__top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hero__tenant{
  display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  color:#fff;font-size:var(--t-micro);font-weight:800;backdrop-filter:blur(4px);
}
.hero__tenant::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--clear);}
.hero__bell{
  position:relative;width:44px;height:44px;border-radius:999px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  display:grid;place-items:center;color:#fff;
}
.hero__bell i{
  position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;
  border-radius:999px;background:var(--halt);color:#fff;border:2px solid var(--panel);
  font-family:var(--mono);font-size:10.5px;font-style:normal;font-weight:700;line-height:16px;text-align:center;
}
.hero__mark{margin-top:26px;display:flex;align-items:center;gap:12px;}
.hero__word{
  font-size:30px;font-weight:900;font-style:italic;letter-spacing:.04em;color:#fff;line-height:1;
}
.hero__word em{font-style:inherit;color:#7fa8ff;}
.hero__claim{
  margin:9px 0 0;font-size:var(--t-sm);font-weight:700;letter-spacing:.06em;color:var(--panel-ink);
}

.big{display:grid;grid-template-rows:1fr 1fr;gap:12px;padding:14px;flex:1;min-height:300px;}
.bigcard{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:22px;border-radius:24px;background:var(--card);border:1px solid var(--line);text-align:center;
  transition:transform .08s ease, border-color .15s ease;
}
.bigcard:active{transform:scale(.985);border-color:var(--signal);}
.bigcard__ico{color:var(--ink);margin-bottom:6px;}
.bigcard b{font-size:var(--t-h2);font-weight:900;letter-spacing:.02em;}
.bigcard span{font-size:var(--t-sm);font-weight:700;color:var(--ink-3);}
.bigcard .tag{position:absolute;top:14px;right:14px;}

/* --------------------------------------------------------------- 停止タイマー */
.halt{
  flex:none;display:flex;align-items:center;gap:10px;padding:9px 16px;
  background:var(--halt);color:#fff;
}
.halt__dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.halt__t{font-size:var(--t-micro);font-weight:800;letter-spacing:.04em;}
.halt__c{margin-left:auto;font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.02em;}

/* --------------------------------------------------------------- 質問 */
.steps{flex:none;padding:12px 16px 13px;background:var(--card);border-bottom:1px solid var(--line);}
.segs{display:flex;gap:5px;}
.segs span{flex:1;height:4px;border-radius:999px;background:var(--sunk);}
.segs span[data-on="true"]{background:var(--signal);}
.steps__m{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:9px;}
.steps__m b{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--signal);}
.steps__m span{
  flex:1;min-width:0;text-align:right;font-size:var(--t-micro);font-weight:700;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.q{margin:4px 0 0;font-size:calc(22px * var(--f));font-weight:900;line-height:1.6;text-wrap:balance;}
.q-hint{margin:9px 0 0;font-size:var(--t-sm);font-weight:600;color:var(--ink-3);line-height:1.75;}
.ans{
  display:flex;align-items:center;gap:13px;width:100%;min-height:74px;padding:15px 17px;
  border-radius:var(--r-ctl);background:var(--card);border:1.5px solid var(--line);text-align:left;
  transition:transform .07s ease, border-color .15s ease, background .15s ease;
}
.ans:active{transform:scale(.99);border-color:var(--signal);background:var(--signal-soft);}
.ans__dot{flex:none;width:21px;height:21px;border-radius:999px;border:2px solid var(--line);}
.ans__l{flex:1;font-size:var(--t-lg);font-weight:800;line-height:1.5;}

.trail{border-top:1px dashed var(--line);padding-top:10px;margin-top:8px;}
.trail__t{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;font-size:var(--t-sm);font-weight:800;color:var(--signal);}
.trail__t svg:last-child{margin-left:auto;transition:transform .18s ease;}
.trail__t[data-open="true"] svg:last-child{transform:rotate(180deg);}
.trail ol{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;}
.trail li{padding-left:13px;border-left:2px solid var(--signal-line);}
.trail li p{margin:0;font-size:var(--t-micro);font-weight:700;color:var(--ink-3);line-height:1.6;}
.trail li button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:40px;text-align:left;}
.trail li b{font-size:var(--t-sm);font-weight:800;}
.trail li span{flex:none;font-size:var(--t-micro);font-weight:800;color:var(--signal);}

/* --------------------------------------------------------------- 結果 */
.cause{margin:2px 0 0;font-size:var(--t-h1);font-weight:900;line-height:1.5;text-wrap:balance;}
.act{padding:17px 18px;}
.act__h{
  display:flex;align-items:center;gap:7px;margin-bottom:7px;
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);
}
.act p{margin:0;font-size:var(--t-body);font-weight:600;line-height:1.95;color:var(--ink-2);}

.vcard{display:block;border-radius:var(--r-card);overflow:hidden;background:var(--card);border:1px solid var(--line);}
.vthumb{position:relative;aspect-ratio:16/9;background:linear-gradient(145deg,#2e4d80,#101725);}
.vthumb canvas{position:absolute;inset:0;width:100%;height:100%;}
.vplay{
  position:absolute;inset:0;margin:auto;width:62px;height:62px;border-radius:999px;
  background:rgba(255,255,255,.95);color:#12203a;display:grid;place-items:center;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.vlen{
  position:absolute;right:9px;bottom:9px;padding:2px 7px;border-radius:6px;
  background:rgba(8,12,20,.78);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;
}
.vcard__b{padding:13px 16px;}
.vcard__b b{display:block;font-size:var(--t-body);font-weight:800;line-height:1.5;}
.vcard__b span{display:block;margin-top:2px;font-size:var(--t-micro);font-weight:600;color:var(--ink-3);}

.linkrow{
  display:flex;align-items:center;gap:10px;min-height:52px;padding:0 15px;
  border-radius:var(--r-ctl);background:var(--signal-soft);color:var(--signal);
  font-size:var(--t-sm);font-weight:800;width:100%;text-align:left;
}
.linkrow svg:last-child{margin-left:auto;}

/* --------------------------------------------------------------- シート */
.sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;}
.sheet__scrim{position:absolute;inset:0;background:rgba(8,12,20,.5);animation:fade .2s ease both;}
.sheet__p{
  position:relative;max-height:90%;display:flex;flex-direction:column;
  background:var(--card);border-radius:26px 26px 0 0;
  box-shadow:0 -10px 40px rgba(8,12,20,.3);animation:rise .26s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet__g{width:40px;height:4px;border-radius:999px;background:var(--line);margin:10px auto 2px;}
.sheet__h{padding:10px 20px 2px;}
.sheet__h h2{margin:9px 0 0;font-size:var(--t-h2);font-weight:900;line-height:1.5;text-wrap:balance;}
.sheet__s{flex:1;overflow-y:auto;padding:14px 20px 6px;display:flex;flex-direction:column;gap:12px;}
.sheet__a{display:flex;gap:10px;padding:12px 20px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);}
.sheet__a .btn{flex:1;font-size:var(--t-body);}

/* 定義リスト */
.kv{margin:0;border:1px solid var(--line);border-radius:var(--r-ctl);overflow:hidden;}
.kv>div{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);}
.kv>div:last-child{border-bottom:none;}
.kv dt{flex:none;width:88px;font-size:var(--t-micro);font-weight:800;color:var(--ink-3);}
.kv dd{flex:1;min-width:0;margin:0;display:flex;align-items:center;gap:6px;font-size:var(--t-sm);font-weight:700;}

/* 自動下書き */
.draft{padding:15px 16px;border-radius:var(--r-ctl);background:var(--signal-soft);border:1px solid var(--signal-line);}
.checks{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:7px;}
.checks li{display:flex;align-items:flex-start;gap:8px;font-size:var(--t-sm);font-weight:700;line-height:1.7;}
.checks svg{flex:none;margin-top:4px;color:var(--clear);}
.draft p{margin:0;font-size:var(--t-sm);font-weight:600;line-height:1.9;color:var(--ink-2);}

/* --------------------------------------------------------------- 機体グリッド */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.mcard{
  display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;
  padding:12px 12px 15px;border-radius:var(--r-card);background:var(--card);border:1px solid var(--line);text-align:center;
}
.mcard:active{border-color:var(--signal);}
.mcard b{font-family:var(--mono);font-size:var(--t-body);font-weight:700;letter-spacing:.02em;}
.mcard>span{font-size:var(--t-micro);font-weight:700;color:var(--ink-3);}
.mthumb{
  position:relative;width:100%;aspect-ratio:5/3;border-radius:12px;background:var(--sunk);
  display:grid;place-items:center;padding:10px;
}
.mthumb svg{width:100%;height:100%;}
.mthumb i{
  position:absolute;right:6px;bottom:4px;font-family:var(--mono);font-style:normal;
  font-size:9px;font-weight:700;color:var(--ink-3);opacity:.65;
}

/* --------------------------------------------------------------- 動画 */
.vrow{display:flex;align-items:center;gap:13px;padding:11px;border-radius:var(--r-card);background:var(--card);border:1px solid var(--line);width:100%;text-align:left;}
.vrow:active{border-color:var(--signal);}
.vrow__t{position:relative;flex:none;width:98px;aspect-ratio:16/10;border-radius:11px;overflow:hidden;background:linear-gradient(145deg,#2e4d80,#101725);display:grid;place-items:center;color:#fff;}
.vrow__t i{position:absolute;right:4px;bottom:3px;font-family:var(--mono);font-style:normal;font-size:10px;font-weight:700;background:rgba(8,12,20,.75);padding:1px 5px;border-radius:5px;}
.vrow__b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start;}
.vrow__b b{font-size:var(--t-body);font-weight:800;line-height:1.5;}
.vrow__b span{font-size:var(--t-micro);font-weight:600;color:var(--ink-3);}

.player{flex:none;background:var(--panel);}
.pstage{position:relative;aspect-ratio:16/9;}
.pstage canvas{position:absolute;inset:0;width:100%;height:100%;}
.pquality{
  position:absolute;left:10px;top:10px;padding:4px 9px;border-radius:999px;
  background:rgba(8,12,20,.6);color:#dbe6f7;font-size:10.5px;font-weight:800;backdrop-filter:blur(4px);
}
.pbar{display:flex;align-items:center;gap:10px;padding:9px 14px;color:var(--panel-ink);}
.pbar .num{font-size:11.5px;font-weight:700;}
.ptrack{flex:1;height:3px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden;}
.ptrack i{display:block;height:100%;background:var(--signal);transition:width .3s ease;}
.chapter{display:flex;align-items:center;gap:13px;width:100%;min-height:52px;padding:11px 16px;text-align:left;border-bottom:1px solid var(--line);}
.chapter:last-child{border-bottom:none;}
.chapter[data-on="true"]{background:var(--signal-soft);color:var(--signal);}
.chapter .num{flex:none;width:40px;font-size:12px;font-weight:700;color:var(--signal);}
.chapter b{flex:1;font-size:var(--t-sm);font-weight:700;line-height:1.5;}
.vacts{display:flex;gap:10px;}
.vact{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;border-radius:var(--r-ctl);border:1.5px solid var(--line);background:var(--card);font-size:var(--t-sm);font-weight:800;color:var(--ink-2);}
.vact[data-on="true"]{border-color:var(--clear);background:var(--clear-soft);color:var(--clear);}

/* --------------------------------------------------------------- 記録 */
.rec{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-card);background:var(--card);border:1px solid var(--line);}
.rec:active{border-color:var(--signal);}
.rec__top{display:flex;align-items:center;gap:8px;}
.rec__id{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-3);}
.rec__t{display:block;margin-top:7px;font-size:var(--t-lg);font-weight:900;line-height:1.5;}
.rec__m{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px;font-size:var(--t-micro);font-weight:700;color:var(--ink-3);}
.rec__f{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);}
.rec__s{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-micro);font-weight:800;color:var(--ink-3);}
.rec__f svg:last-child{margin-left:auto;color:var(--ink-3);opacity:.6;}

.fab{
  position:absolute;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:5;
  display:flex;align-items:center;gap:8px;height:54px;padding:0 21px;border-radius:999px;
  background:var(--signal);color:#fff;font-size:var(--t-body);font-weight:800;
  box-shadow:0 10px 26px -6px color-mix(in srgb,var(--signal) 60%, transparent);
}
:root[data-theme="dark"] .fab{color:#0b0f16;}

.auto>div{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 14px;border-bottom:1px solid var(--line);}
.auto>div:last-child{border-bottom:none;}
.auto dt{flex:none;width:88px;font-size:var(--t-micro);font-weight:800;color:var(--ink-3);white-space:nowrap;}
.auto dd{flex:1;min-width:0;margin:0;display:flex;align-items:center;gap:6px;font-size:var(--t-sm);font-weight:800;white-space:nowrap;}
.auto dd em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink-3);}
.auto select{flex:1;min-width:0;height:44px;padding:0 9px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);font-family:var(--mono);font-size:14px;font-weight:700;}
.auto__ico{flex:none;width:44px;height:44px;border-radius:11px;background:var(--signal-soft);color:var(--signal);display:grid;place-items:center;}
.auto__fix{
  flex:none;display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 14px;border-radius:999px;
  border:1.5px solid var(--line);font-size:var(--t-micro);font-weight:800;color:var(--ink-2);
}
.auto__fix[data-on="true"]{border-color:var(--clear);background:var(--clear-soft);color:var(--clear);}

.photos{display:flex;flex-wrap:wrap;gap:10px;}
.photo-add{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  width:100px;height:100px;border-radius:var(--r-ctl);border:2px dashed var(--signal-line);
  background:var(--signal-soft);color:var(--signal);font-size:var(--t-micro);font-weight:800;
}
.photo{position:relative;width:100px;height:100px;border-radius:var(--r-ctl);background:var(--sunk);color:var(--ink-3);display:grid;place-items:center;}
.photo button{position:absolute;top:-6px;right:-6px;width:25px;height:25px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:800;line-height:1;}

.disclosure{
  display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:0 16px;
  border-radius:var(--r-ctl);border:1.5px dashed var(--line);font-size:var(--t-sm);font-weight:800;color:var(--ink-2);
}
.disclosure svg:last-child{margin-left:auto;transition:transform .18s ease;}
.disclosure[data-open="true"] svg:last-child{transform:rotate(180deg);}

.toast{
  display:flex;align-items:center;gap:10px;margin:12px 16px -4px;padding:12px 14px;
  border-radius:var(--r-ctl);background:var(--clear-soft);color:var(--clear);
  font-size:var(--t-sm);font-weight:800;animation:rise .24s ease both;
}
.toast button{margin-left:auto;font-size:var(--t-micro);font-weight:800;opacity:.75;}

/* --------------------------------------------------------------- 資料集 */
.topic-h{margin:0;font-size:var(--t-h1);font-weight:900;line-height:1.45;text-wrap:balance;}
.toc{padding:13px 16px;border-radius:var(--r-ctl);background:var(--card);border:1px solid var(--line);}
.toc b{
  display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;
}
.toc a{display:block;min-height:38px;line-height:38px;font-size:var(--t-sm);font-weight:800;color:var(--signal);}
.doc{display:flex;flex-direction:column;gap:13px;}
.doc h2{margin:8px 0 0;font-size:var(--t-lg);font-weight:900;padding-left:11px;border-left:3px solid var(--signal);scroll-margin-top:12px;}
.doc p{margin:0;font-size:var(--t-body);font-weight:600;line-height:2;color:var(--ink-2);}
.doc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
.doc ol li{display:flex;gap:11px;padding:12px 14px;border-radius:var(--r-ctl);background:var(--card);border:1px solid var(--line);font-size:var(--t-body);font-weight:700;line-height:1.75;}
.doc ol li span{flex:none;width:25px;height:25px;border-radius:999px;background:var(--signal);color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;display:grid;place-items:center;}
:root[data-theme="dark"] .doc ol li span{color:#0b0f16;}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--card);}
table{width:100%;border-collapse:collapse;font-size:var(--t-sm);}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:var(--sunk);font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
tr:last-child td{border-bottom:none;}
td:first-child{font-family:var(--mono);font-weight:700;}
.figure{margin:0;}
.figbox{
  aspect-ratio:16/9;border-radius:var(--r-ctl);border:1px solid var(--line);
  background:repeating-linear-gradient(45deg,var(--sunk),var(--sunk) 11px,var(--card) 11px,var(--card) 22px);
  display:grid;place-items:center;font-size:var(--t-micro);font-weight:800;color:var(--ink-3);
}
.figure figcaption{margin-top:6px;font-size:var(--t-micro);font-weight:700;color:var(--ink-3);}
.source{margin:8px 0 0;text-align:center;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-3);}

/* --------------------------------------------------------------- メニュー */
.profile{display:flex;align-items:center;gap:13px;padding:16px;border-radius:var(--r-card);background:var(--panel);color:#fff;}
.profile__a{width:50px;height:50px;border-radius:999px;background:rgba(126,166,255,.18);color:#8fb2ff;display:grid;place-items:center;}
.profile b{display:block;font-size:var(--t-lg);font-weight:900;}
.profile span{display:block;font-size:var(--t-micro);font-weight:700;color:var(--panel-ink);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat{padding:13px 8px;border-radius:var(--r-ctl);background:var(--card);border:1px solid var(--line);text-align:center;}
.stat b{display:block;font-family:var(--mono);font-size:var(--t-h2);font-weight:700;color:var(--signal);}
.stat span{display:block;margin-top:2px;font-size:10.5px;font-weight:700;color:var(--ink-3);}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--sunk);}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:var(--t-micro);font-weight:800;color:var(--ink-3);}
.seg button[data-on="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(8,12,20,.12);}
.version{margin:10px 0 0;text-align:center;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-3);}

/* お知らせ */
.ncard{display:flex;gap:12px;padding:15px;border-radius:var(--r-card);background:var(--card);border:1px solid var(--line);}
.ncard[data-unread="true"]{border-color:var(--signal-line);}
.ncard__i{flex:none;width:38px;height:38px;border-radius:11px;background:var(--signal-soft);color:var(--signal);display:grid;place-items:center;}
.ncard__b{flex:1;min-width:0;}
.ncard__t{display:flex;align-items:flex-start;gap:8px;}
.ncard__t b{flex:1;font-size:var(--t-body);font-weight:900;line-height:1.5;}
.ndot{flex:none;width:8px;height:8px;margin-top:7px;border-radius:999px;background:var(--halt);}
.ncard p{margin:4px 0 0;font-size:var(--t-sm);font-weight:600;line-height:1.75;color:var(--ink-2);}
.ncard time{display:block;margin-top:7px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-3);}

.empty{text-align:center;padding:48px 24px;color:var(--ink-3);}
.empty b{display:block;margin:10px 0 4px;font-size:var(--t-body);font-weight:800;color:var(--ink-2);}
.empty p{margin:0;font-size:var(--t-sm);font-weight:600;}

.anim{animation:rise .22s ease both;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>

</div>

  if(S.screen !== screen) S.stack.push({screen:S.screen, p:S.p});
  S.screen = screen; S.p = p || {};
  onEnter();
  render();
  el.view.scrollTop = 0;
}
function back(){
  const prev = S.stack.pop();
  if(prev){ S.screen = prev.screen; S.p = prev.p; } else { S.screen = "home"; S.p = {}; }
  onEnter(); render();
}
function jump(screen){ // レールからの直接ジャンプ（デモ用に代表的な引数を入れる）
  const preset = {
    "ts-list":{mid:"mr100"},
    "ts-run":{mid:"mr100", tid:"dpf"},
    "ts-result":{mid:"mr100", tid:"dpf"},
    "video-list":{mid:"mr100"},
    "player":{mid:"mr100", vid:"v-sensor"},
    "record":{id:"2026-014"},
    "topic":{id:"t-daily"}
  }[screen] || {};
  S.stack = []; S.screen = screen; S.p = preset;
  if(screen === "ts-run"){ S.cursor = "q1"; S.answers = []; }
  if(screen === "ts-result"){ // 代表の結果まで進めた状態を作る
    const t = tree("dpf");
    S.answers = [
      {id:"q1", q:t.nodes.q1.q, l:"KWP809/810を検出した"},
      {id:"q2", q:t.nodes.q2.q, l:"はい、範囲を超えている"},
      {id:"q3", q:t.nodes.q3.q, l:"確認済みで異常なし"}
    ];
    S.cursor = "r-sensor"; S.screen = "ts-run";
  }
  onEnter(); render(); el.view.scrollTop = 0;
}

let ticker = null;
function onEnter(){
  clearInterval(ticker); ticker = null;
  if(S.screen === "ts-run"){
    if(S.haltStart === null) S.haltStart = Date.now();
    ticker = setInterval(() => {
      const isResult = S.cursor && S.cursor.startsWith("r-");
      if(!isResult) S.elapsedMs = Date.now() - S.haltStart;
      const c = document.getElementById("haltclock");
      if(c) c.textContent = mmss(S.elapsedMs);
    }, 1000);
    S.elapsedMs = Date.now() - S.haltStart;
  } else {
    S.haltStart = null; S.elapsedMs = 0; S.sheet = false;
  }
}
const mmss = ms => {
  const s = Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
};

function render(){
  const out = SCREENS[S.screen]();
  el.chrome.innerHTML = out.chrome !== undefined ? out.chrome : "";
  el.view.dataset.screen = S.screen;
  el.view.innerHTML = out.view || "";
  el.dock.innerHTML = out.dock || "";
  el.overlay.innerHTML = out.overlay || "";

  el.tabs.innerHTML = TABS.map(t => `
    <button class="tab" data-tab="${t.k}" data-on="${t.is(S.screen)}" ${t.is(S.screen) ? 'aria-current="page"' : ""}>
      ${ICON[t.icon]({s:23})}${t.label}
    </button>`).join("");

  el.rail.innerHTML = RAIL.map(([g, items]) => `
    <div class="rail__group">${g}</div>
    ${items.map(([k,l]) => `<button class="rail__item" data-jump="${k}" data-on="${k === S.screen}">${l}</button>`).join("")}`).join("");

  paintCanvases();
}

/* 装飾グラフィックはCanvasで描く（長いSVGパスを手書きしない） */
function paintCanvases(){
  const hero = el.view.querySelector("[data-hero]");
  if(hero) paintHero(hero);
  document.querySelectorAll("[data-film]").forEach(paintFilm);
}
function paintHero(cv){
  const g = cv.getContext("2d"), w = cv.width, h = cv.height;
  const grad = g.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,"#111a2b"); grad.addColorStop(.55,"#16233d"); grad.addColorStop(1,"#0d1220");
  g.fillStyle = grad; g.fillRect(0,0,w,h);
  // 計器のグリッド
  g.strokeStyle = "rgba(126,166,255,.10)"; g.lineWidth = 1;
  for(let x = 0; x <= w; x += 40){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
  for(let y = 0; y <= h; y += 40){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  // 稼働を示す同心円
  g.strokeStyle = "rgba(126,166,255,.22)";
  [70,120,175].forEach(r => { g.beginPath(); g.arc(w*.82, h*.28, r, 0, Math.PI*2); g.stroke(); });
  // 斜めのプレート
  g.fillStyle = "rgba(31,95,224,.30)";
  g.beginPath(); g.moveTo(0,0); g.lineTo(w*.34,0); g.lineTo(0,h*.62); g.closePath(); g.fill();
  g.fillStyle = "rgba(31,95,224,.16)";
  g.beginPath(); g.moveTo(w,h); g.lineTo(w*.62,h); g.lineTo(w,h*.34); g.closePath(); g.fill();
  // 停止していないことを示すドット列
  g.fillStyle = "rgba(160,190,255,.4)";
  for(let r = 0; r < 5; r++) for(let c = 0; c < 9; c++){
    g.beginPath(); g.arc(w*.66 + c*13, 30 + r*13, 1.8, 0, Math.PI*2); g.fill();
  }
}
function paintFilm(cv){
  const g = cv.getContext("2d"), w = cv.width, h = cv.height;
  const grad = g.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,"#3a5f9c"); grad.addColorStop(1,"#0f1725");
  g.fillStyle = grad; g.fillRect(0,0,w,h);
  g.strokeStyle = "rgba(255,255,255,.10)"; g.lineWidth = 2;
  for(let i = -h; i < w; i += 26){ g.beginPath(); g.moveTo(i,h); g.lineTo(i+h,0); g.stroke(); }
  g.fillStyle = "rgba(8,12,20,.28)"; g.fillRect(0,h*.62,w,h*.38);
}

el.app.addEventListener("click", e => {
  const t = e.target;
  const hit = sel => t.closest(sel);
  let n;

  if((n = hit("[data-back]"))) return back();
  if((n = hit("[data-tab]"))){ S.stack = []; S.screen = n.dataset.tab; S.p = {}; onEnter(); render(); el.view.scrollTop = 0; return; }

  if((n = hit("[data-go]"))){
    const s = n.dataset.go;
    const p = {};
    if(n.dataset.mid) p.mid = n.dataset.mid;
    if(n.dataset.tid) p.tid = n.dataset.tid;
    if(n.dataset.vid) p.vid = n.dataset.vid;
    if(n.dataset.id)  p.id  = n.dataset.id;
    if(n.dataset.tree) p.tree = n.dataset.tree;
    if(s === "ts-run"){ S.cursor = tree(p.tid).root; S.answers = []; S.trailOpen = false; S.haltStart = null; }
    if(s === "video-list") S.part = "すべて";
    if(s === "player") S.chapter = 0;
    if(s === "record-new") S.form = { mid:p.mid || "mr100", cause:p.tree ? "破損" : "", phrases:[], photos:0,
      body:p.tree ? "エラーコード KWP809/810 の検出を確認した上で、DPF差圧センサーを交換。交換後、診断機でサービスルーチンを実行し、正常完了することを確認した。" : "",
      hmFixed:false, detail:false, kind:"トラブル対応", ai:!!p.tree };
    return go(s, p);
  }

  /* 質問 */
  if((n = hit("[data-answer]"))){
    const t2 = tree(S.p.tid), node = t2.nodes[S.cursor], a = node.a[+n.dataset.answer];
    S.answers.push({id:node.id, q:node.q, l:a.l});
    S.cursor = a.n; S.trailOpen = false;
    return render();
  }
  if(hit("[data-trail]")){ S.trailOpen = !S.trailOpen; return render(); }
  if((n = hit("[data-rewind]"))){
    const i = +n.dataset.rewind;
    S.cursor = S.answers[i].id; S.answers = S.answers.slice(0,i); S.trailOpen = false;
    return render();
  }
  if(hit("[data-undo]")){
    if(!S.answers.length) return back();
    const last = S.answers.pop(); S.cursor = last.id; return render();
  }
  if(hit("[data-sheet]")){ S.sheet = true; return render(); }
  if(hit("[data-closesheet]")){ S.sheet = false; return render(); }
  if(hit("[data-save]")){
    S.sheet = false; S.toast = true; S.stack = []; S.screen = "records"; S.p = {};
    onEnter(); render(); el.view.scrollTop = 0;
    setTimeout(() => { if(S.toast){ S.toast = false; if(S.screen === "records") render(); } }, 4200);
    return;
  }
  if(hit("[data-toastoff]")){ S.toast = false; return render(); }

  /* 動画 */
  if((n = hit("[data-part]"))){ S.part = n.dataset.part; return render(); }
  if((n = hit("[data-chapter]"))){ S.chapter = +n.dataset.chapter; return render(); }
  if((n = hit("[data-savevid]"))){ const id = n.dataset.savevid; S.savedOverride[id] = !isSaved(video(id)); return render(); }

  /* 記録 */
  if((n = hit("[data-filter]"))){ S.filter = n.dataset.filter; return render(); }
  if((n = hit("[data-cause]"))){ S.form.cause = n.dataset.cause; return render(); }
  if((n = hit("[data-kind]"))){ S.form.kind = n.dataset.kind; return render(); }
  if((n = hit("[data-phrase]"))){
    const p = n.dataset.phrase, list = S.form.phrases;
    S.form.phrases = list.includes(p) ? list.filter(x => x !== p) : [...list, p];
    return render();
  }
  if((n = hit("[data-photo]"))){
    S.form.photos = Math.max(0, S.form.photos + (n.dataset.photo === "+" ? 1 : -1));
    return render();
  }
  if(hit("[data-hm]")){ S.form.hmFixed = true; return render(); }
  if(hit("[data-detail]")){ S.form.detail = !S.form.detail; return render(); }
  if(hit("[data-ai]")){
    const src = [S.form.body, ...S.form.phrases].filter(Boolean).join("。").replace(/。+$/,"");
    S.form.body = src ? src + "。以上の対応により復旧を確認した。"
      : "写真の内容から、対象部位に異常を確認。清掃・調整を実施し、試運転で正常動作を確認した。";
    S.form.cause = S.form.cause || "摩耗";
    S.form.ai = true;
    return render();
  }
  if(hit("[data-voice]")){
    S.form.body = (S.form.body ? S.form.body + " " : "") + "（音声入力）加工中に主軸から異音、エラー表示で停止した。";
    return render();
  }

  /* 資料集 */
  if((n = hit("[data-qset]"))){ S.query = n.dataset.qset; return render(); }
  if(hit("[data-qclear]")){ S.query = ""; return render(); }
  if((n = hit("[data-fav]"))){ const id = n.dataset.fav; S.favOverride[id] = !isFav(topic(id)); return render(); }

  /* 設定 */
  if((n = hit("[data-theme-set]"))){
    document.documentElement.setAttribute("data-theme", n.dataset.themeSet);
    return render();
  }
  if((n = hit("[data-size]"))){
    S.size = n.dataset.size;
    document.documentElement.style.setProperty("--f", S.size === "大きい" ? "1.12" : "1");
    return render();
  }
});

el.app.addEventListener("input", e => {
  if(e.target.matches("[data-body]")) S.form.body = e.target.value;
  if(e.target.matches("[data-q]")){
    S.query = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const again = el.view.querySelector("[data-q]");
    if(again){ again.focus(); again.setSelectionRange(pos, pos); }
  }
});
el.app.addEventListener("change", e => {
  if(e.target.matches("[data-mid-select]")){ S.form.mid = e.target.value; render(); }
});

document.addEventListener("click", e => {
  const n = e.target.closest("[data-jump]");
  if(n) jump(n.dataset.jump);
});

/* OSのテーマ設定を初期値にする */
if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){
  document.documentElement.setAttribute("data-theme","dark");
}
render();
</script>
</body>
</html>
